<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>돌깨기 클리커</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="hud">
      <div class="hud-block">
        <span class="hud-label">점수</span>
        <span id="score" class="hud-value">0</span>
      </div>
      <div class="hud-block">
        <span class="hud-label">최고 기록</span>
        <span id="highScore" class="hud-value">0</span>
      </div>
      <div class="hud-block">
        <span class="hud-label">부순 돌</span>
        <span id="broken" class="hud-value">0</span>
      </div>
      <div class="hud-block hud-coin" id="coinBlock">
        <span class="hud-label">🪙 게임머니</span>
        <span id="coinCount" class="hud-value coin-value">-</span>
      </div>
    </header>

    <p class="hint">돌을 연타해서 깨트리세요. 클릭마다 조금씩, 완전히 부수면 보너스!</p>

    <main class="stage" id="stage">
      <div class="crack-layer" id="crackLayer" aria-hidden="true"></div>
      <button type="button" id="rock" class="rock" aria-label="돌 치기">
        <span class="rock-face"></span>
        <span class="rock-shine"></span>
      </button>
      <div class="hp-bar" role="status" aria-live="polite">
        <div class="hp-fill" id="hpFill"></div>
      </div>
    </main>

    <footer class="footer">
      <span id="combo" class="combo hidden">콤보 ×1</span>
    </footer>
  </div>
  <script src="config.js"></script>
  <script src="game.js"></script>
</body>
</html>
